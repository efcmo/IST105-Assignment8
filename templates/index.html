<!DOCTYPE html>
<html>
<head>
    <title>DHCP Lease Viewer</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        h1 { color: #008080; }
        table { border-collapse: collapse; width: 50%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        input, select { padding: 5px; }
    </style>
</head>
<body>
    <h1>DHCP Lease Viewer</h1>

    <form method="POST">
        {% csrf_token %}
        <label>MAC Address:</label>
        <input type="text" name="mac" required>
        <label>DHCP Version:</label>
        <select name="dhcp">
            <option value="DHCPv4">DHCPv4</option>
            <option value="DHCPv6">DHCPv6</option>
        </select>
        <button type="submit">Add Lease</button>
    </form>

    <h2>Current Leases</h2>
    <table>
        <tr><th>MAC Address</th><th>DHCP Type</th></tr>
        {% for lease in leases %}
        <tr><td>{{ lease.mac }}</td><td>{{ lease.dhcp }}</td></tr>
        {% empty %}
        <tr><td colspan="2">No leases found.</td></tr>
        {% endfor %}
    </table>
</body>
</html>
